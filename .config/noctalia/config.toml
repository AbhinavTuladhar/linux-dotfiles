[nightlight]
enabled = true
temperature_day = 7000
temperature_night = 3000

[osd]
position = "bottom_center"

[plugins]
enabled = [
    "noctalia/bongocat",
    "noctalia/screen_recorder",
    "noctalia/wallhaven",
    "oldirtty/color_picker",
    "dotnetrob/cat",
    "apex077/eyecare"
]

[shell]
font_family = "Fira Sans"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.animation]
    speed = 0.5000000074505806

    [shell.launcher]
    app_grid = true
    compact = true

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    session_position = "center"
    shadow = false

    [shell.session]
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

    [shell.shadow]
    alpha = 0.58999998681247234
    direction = "center"

[theme]
community_palette = "Catppuccin Macchiato Blue"
mode = "dark"

[wallpaper]
directory = "/home/abhinavtuladhar/Pictures/Wallpapers"
per_monitor_directories = true
transition = [ "disc", "fade", "stripes", "wipe", "zoom" ]
transition_duration = 2000

    [wallpaper.automation]
    enabled = true
    interval_seconds = 60

    [wallpaper.default]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-0j2qxy.png"

    [wallpaper.last]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-4x379l.jpg"

    [wallpaper.monitor.DP-2]
    directory = "/home/abhinavtuladhar/Pictures/Wallpapers"

    [wallpaper.monitor.eDP-1]
    directory = "/home/abhinavtuladhar/Pictures/Wallpapers"

    [wallpaper.monitors.DP-2]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-4x379l.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wp11541537-the-legend-of-heroes-trails-from-zero-wallpapers.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-395yoy.jpg"

[widget.audio_visualizer]
bands = 64
capsule = true
capsule_padding = 4
centered = false
mirrored = false
width = 64

[widget.battery]
hide_when_full = true

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
capsule = true
capsule_padding = 4
color = "primary"
font_family = "Adwaita Mono"
input_devices = [ "/dev/input/by-id/*-event-*" ]
scale = 2.0
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.cat_2]
capsule_padding = 0
cat_color = "primary"
cat_color_mode = "custom"
cat_size = 32
font_family = "JetBrains Mono"
run_threshold = 50
scale = 1.1000000000000001
show_cpu_percent = true
type = "dotnetrob/cat:cat"

[widget.clock]
font_family = "JetBrains Mono"
format = "{:%Y-%m-%d %A, %-I:%M:%S %p}"

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"

[widget.media]
capsule = true
capsule_padding = 10
font_family = "Fira Sans"
hide_artist = true
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.network_rx]
display = "text"
font_family = "Hack Nerd Font Mono"
label_min_width = 48

[widget.network_tx]
display = "text"
font_family = "Hack Nerd Font Mono"
label_min_width = 48

[widget.ram]
display = "text"
font_family = "JetBrains Mono"
highlight_color = "tertiary"
label_min_width = 64
scale = 0.90000000000000002
visualization = "none"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
glyph = "pokeball"

[widget.temp]
display = "text"
font_family = "JetBrains Mono"
highlight_color = "primary"
scale = 0.90000000000000002
visualization = "none"

[widget.volume]
show_label = false

    [widget.volume.actions]
    scroll_down = "volume-down 2%"
    scroll_up = "volume-up 2%"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
color = "tertiary"
enabled = false
font_family = "Iosevka Nerd Font"
icon_color = "tertiary"

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
hide_when_empty = true
labels_only_when_occupied = true
pill_scale = 0.80000000000000004

[audio] 
enable_overdrive = true