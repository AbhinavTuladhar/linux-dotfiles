# ==============================================================================
# Input
# Enable NumLock when a physical keyboard connects.
# https://docs.noctalia.dev/umbriel/input/
[input.keyboard]
numlock_toggle = true

[input.touchpad]
natural_scroll = true
sensitivity = 0.5
accel_profile = "flat"
scroll_factor = 0.5
# Focus can follow the pointer across tiled, floating, and pinned windows.
# [input.focus]
# follows_mouse = true

# Confine touch input to one display.
# [input.touch]
# enabled = true
# map_to_output = "eDP-1"

[input.cursor]
theme = "catppuccin-macchiato-sapphire-cursors"
