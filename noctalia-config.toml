[nightlight]
enabled = true

[osd]
position = "bottom_center"

[plugins]
enabled = [ "noctalia/bongocat", "noctalia/screen_recorder", "noctalia/wallhaven", "oldirtty/color_picker" ]

[shell]
font_family = "Fira Sans"
password_style = "random"
polkit_agent = true
settings_show_advanced = true

    [shell.animation]
    speed = 0.5000000074505806

    [shell.panel]
    borders = false
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_control_center = true
    open_near_click_session = true
    session_placement = "floating"
    session_position = "center"
    shadow = false

    [shell.session]
    grid_columns = 2

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 10.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Lavender"
mode = "dark"
source = "community"

[wallpaper]
directory = "/home/abhinavtuladhar/Pictures/Wallpapers"
per_monitor_directories = true
transition = [ "disc", "fade", "stripes", "wipe", "zoom" ]
transition_duration = 2000

    [wallpaper.automation]
    enabled = true
    interval_seconds = 60

    [wallpaper.default]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-w8o32q.jpg"

    [wallpaper.last]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-4x379l.jpg"

    [wallpaper.monitor.eDP-1]
    directory = "/home/abhinavtuladhar/Pictures/Wallpapers"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-4x379l.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/abhinavtuladhar/Pictures/Wallpapers/wallhaven-395yoy.jpg"

[widget.audio_visualizer]
bands = 64
capsule = true
capsule_padding = 4
centered = false
mirrored = false
width = 64

[widget.battery]
hide_when_full = true
hide_when_plugged = true

[widget.brightness]
show_label = false

[widget.cat]
audio_spectrum = true
capsule = true
capsule_padding = 4
color = "primary"
font_family = "Adwaita Mono"
input_devices = [ "/dev/input/by-id/*-event-*" ]
scale = 2.0
tappy_mode = true
type = "noctalia/bongocat:cat"

[widget.clock]
font_family = "Fira Sans Medium"
format = "{:%Y-%m-%d %A, %-I:%M %p}"

[widget.cpu]
display = "text"
font_family = "Noto Sans Mono"

[widget.launcher]
custom_image = "/usr/share/icons/cachyos.svg"

[widget.media]
capsule = true
capsule_padding = 10
font_family = "Fira Sans Medium"
hide_artist = true
hide_when_no_media = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.network_rx]
display = "text"
label_min_width = 48

[widget.network_tx]
display = "text"
label_min_width = 48

[widget.ram]
display = "text"
font_family = "Noto Sans Mono"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.session]
glyph = "pokeball"

[widget.volume]
scroll_step = 2
show_label = false

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.widget]
type = "oldirtty/color_picker:widget"

[widget.workspaces]
hide_when_empty = true
labels_only_when_occupied = true
scale = 1.25
