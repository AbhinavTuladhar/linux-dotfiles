tint_intensity = 0.0

[bar.default]
background_opacity = 0.4999999888241291
border = "primary"
border_width = 1.0
capsule = true
capsule_fill = "on_secondary"
capsule_opacity = 0.34999999217689037
capsule_radius = 6
capsule_thickness = 0.69999998807907104
