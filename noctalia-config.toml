    fill = "on_primary"
    id = "g1"
    members = [ "network", "volume", "brightness", "battery" ]
    opacity = 0.30000001192092896
    padding = 10.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "on_secondary"
    id = "g2"
    members = [ "cpu", "ram" ]
    opacity = 0.29999998211860657
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "on_secondary"
    id = "g3"
    members = [ "network_rx", "network_tx" ]
    opacity = 0.34999999403953552
    padding = 6.0
    radius = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "on_secondary"
