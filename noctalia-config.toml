    members = [ "notifications", "clipboard" ]
    opacity = 0.34999999403953552
    padding = 6.0
    radius = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "on_secondary"
    id = "g5"
    members = [ "widget", "recorder" ]
    opacity = 0.34999999403953552
    padding = 6.0
    radius = 6.0

[control_center]
